[project]
name = "rfsensing"
version = "0.1.0"
description = "WiFi CSI sensing datasets, models, training, and benchmarks"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "lightning>=2.2",
    "torchmetrics>=1.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "tensorboard>=2.16",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jupytext>=1.16",
    "ipykernel>=6",
    "nbclient>=0.9",
    "matplotlib>=3.8",
    "pandas>=2",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: requires complete external WiFi CSI benchmark datasets",
]
